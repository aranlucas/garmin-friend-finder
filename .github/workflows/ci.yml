name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm run format:check && pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prove regression assertions fail on audited baseline
        run: |
          files=(src/app/api/account/route.ts src/app/api/account/register/route.ts src/services/accounts.ts src/lib/server-errors.ts)
          trap 'git restore -- "${files[@]}"' EXIT
          for file in "${files[@]}"; do
            git show "9f3ec07b41af6ff94126b5913686714cde7b5ee8:$file" > "$file"
          done
          set +e
          pnpm exec vitest run test/reliability.test.ts --reporter=json --outputFile=baseline-results.json
          result=$?
          set -e
          test "$result" -eq 1
          node -e 'const r=require("./baseline-results.json"); if(r.numFailedTests !== 7 || r.numPassedTests !== 0 || r.numTotalTests !== 7) process.exit(1)'

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec e2e-web install chromium --with-deps

      - name: Browser registration journey
        run: pnpm exec e2e run
        env:
          E2E_TELEMETRY_DISABLED: "1"
          DATABASE_PATH: ${{ runner.temp }}/reliability-e2e.db
          AUTH_SECRET: ci-only-disposable-auth-secret-no-production-access
          AUTH_TRUST_HOST: "true"

      - name: Upload regression and browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-evidence
          include-hidden-files: true
          path: |
            baseline-results.json
            .e2e/
          retention-days: 7
